dataset_configs:
  desc: Dataset Configurations
  value:
    base_dataset_path: "./dataset/" # LOCAL
    # base_dataset_path: "/content/drive/MyDrive/Programming/dataset/" # GOOGLE COLAB
    plantpathology: "plantpathology"
    stanfordcars: "stanfordcars"
    flowers102: "flowers102"
    dtd: "dtd"
    imagenet-o: "imagenet-o"

training_hyperparameters:
  desc: Training Hyperparameters
  value:
    batch_size: 32
    num_epochs: 25
    learning_rate: 0.0001
    weight_decay: 0.0001
    warmup_steps: 4000
    lambda_ood: 0.05
    m_in: -7.1
    m_out: -4.7
    warmup_epochs: 2

experiment_details:
  desc: Experiment Details
  value:
    model_dir: "./trained_models/"
    experiment_name: "e5_energy_based_finetuning"
    use_wandb: True
    base_model_ckpt: "./trained_models/e1_baseline/checkpoints/likely-capybara-9_best_val_balanced_accuracy.ckpt"

plant_label_encoding:
  desc: Plant Label Encoding
  value:
    "healthy": 0
    "scab": 1
    "rust": 2
    "frog_eye_leaf_spot": 3
    "powdery_mildew": 4

wandb_config:
